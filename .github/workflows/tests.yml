name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - smalltalk: Moose64-11
            spec: .smalltalk.ston
            coverage: false
          - smalltalk: Moose64-12
            spec: .smalltalk.ston
            coverage: false
          - smalltalk: Moose64-13
            spec: .smalltalk.coverage.ston
            coverage: true
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v7

      - name: Check build tools
        run: |
          mvn --version
          gradle --version

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Run tests
        run: smalltalkci -s ${{ matrix.smalltalk }} ${{ matrix.spec }}
        shell: bash
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Coveralls
        if: ${{ matrix.coverage }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: coverage/lcov.info

  integration:
    runs-on: ubuntu-latest
    name: Moose64-13 integration
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check build tools
        run: |
          mvn --version
          gradle --version

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: Moose64-13

      - name: Run integration tests
        run: smalltalkci -s Moose64-13 .smalltalk.integration.ston
        shell: bash
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-tool-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest supported
            java: '8'
            maven: '3.6.3'
            gradle: '6.9.4'
          - name: current stable
            java: '17'
            maven: '3.9.16'
            gradle: '9.7.1'
    name: Java build tools (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Maven and Gradle
        run: ci/install-build-tools.sh "$RUNNER_TEMP/build-tools" "${{ matrix.maven }}" "${{ matrix.gradle }}" >> "$GITHUB_PATH"

      - name: Check build tools
        run: |
          mvn --version
          gradle --version

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: Moose64-13

      - name: Run integration tests
        run: smalltalkci -s Moose64-13 .smalltalk.integration.ston
        shell: bash
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
