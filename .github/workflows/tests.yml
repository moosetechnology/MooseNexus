name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Determine test scope
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PULL_REQUEST_BASE"
            head="$PULL_REQUEST_HEAD"
            range="$base...$head"
          else
            base="$PUSH_BEFORE"
            head="$HEAD"
            range="$base..$head"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo 'run_tests=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$range" | grep -qvE '^(README\.md|docs/|LICENSE$)'; then
            echo 'run_tests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_tests=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - smalltalk: Moose64-11
            spec: .smalltalk.ston
            coverage: false
          - smalltalk: Moose64-12
            spec: .smalltalk.ston
            coverage: false
          - smalltalk: Moose64-13
            spec: .smalltalk.coverage.ston
            coverage: true
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v7

      - name: Check build tools
        run: |
          mvn --version
          gradle --version

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Run tests
        run: smalltalkci -s ${{ matrix.smalltalk }} ${{ matrix.spec }}
        shell: bash
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Coveralls
        if: ${{ matrix.coverage }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: coverage/lcov.info

  build-tool-compatibility:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest supported
            java: '8'
            maven: '3.6.3'
            gradle: '6.9.4'
          - name: current stable
            java: '17'
            maven: '3.9.16'
            gradle: '9.7.1'
    name: Java build tools (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Maven and Gradle
        run: ci/install-build-tools.sh "$RUNNER_TEMP/build-tools" "${{ matrix.maven }}" "${{ matrix.gradle }}" >> "$GITHUB_PATH"

      - name: Check build tools
        run: |
          mvn --version
          gradle --version

      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: Moose64-13

      - name: Run integration tests
        run: smalltalkci -s Moose64-13 .smalltalk.integration.ston
        shell: bash
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
