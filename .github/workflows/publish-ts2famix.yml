name: Publish TypeScript importer image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish TypeScript importer image
        run: |
          docker build --tag ghcr.io/moosetechnology/moosenexus-ts2famix:3.2.0-679f54e docker/ts2famix
          docker push ghcr.io/moosetechnology/moosenexus-ts2famix:3.2.0-679f54e
